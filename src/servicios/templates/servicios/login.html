{% extends "servicios/index.html" %}

{% block title %}Iniciar Sesión - Easy Office{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-md border border-gray-200 p-8 my-6">
    <div class="text-center mb-6">
        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl mb-3">
            <i class="fa-solid fa-user-lock"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Iniciar Sesión</h2>
        <p class="text-xs text-gray-500 mt-1">Accede a tu panel Easy Office</p>
    </div>

    {% if error_message %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-xs font-semibold text-center">
            {{ error_message }}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Usuario</label>
            <input type="text" name="username" required placeholder="Nombre de usuario" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Contraseña</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow transition">
            Ingresar
        </button>
    </form>

    <div class="mt-6 border-t pt-4 text-center">
        <p class="text-xs text-gray-500">
            ¿No tienes una cuenta aún? 
            <a href="{% url 'registro' %}" class="text-emerald-600 font-bold hover:underline">Regístrate aquí</a>
        </p>
    </div>
</div>
{% endblock %}
